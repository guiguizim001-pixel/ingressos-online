services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja_local
      POSTGRES_DB: loja
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["loja_db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja"]
      interval: 5s
      timeout: 3s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  loja_db:
